<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tonton - TempePlay</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/watch.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="../index.html" class="nav-brand">
      <img src="../assets/logo.png" alt="TempePlay" onerror="this.style.display='none'" />
      <span>Tempe<span class="accent">Play</span></span>
    </a>
    <div class="nav-search">
      <input type="text" id="search-input" placeholder="Cari anime..." />
      <button id="search-btn">🔍</button>
    </div>
    <div class="nav-actions">
      <a href="watchparty.html" class="btn-watchparty">🍿 Watch Party</a>
      <div id="user-menu" class="user-menu hidden">
        <img id="user-avatar" src="" alt="Avatar" class="user-avatar" />
        <div class="user-dropdown">
          <span id="user-display-name" class="user-name"></span>
          <a href="profile.html">Profil</a>
          <button id="btn-logout">Keluar</button>
        </div>
      </div>
      <button id="btn-login-nav" class="btn-primary">Masuk</button>
    </div>
  </nav>

  <!-- AUTH OVERLAY (same as index) -->
  <div id="auth-overlay" class="auth-overlay hidden">
    <div class="auth-modal">
      <div class="auth-logo">
        <span class="brand-text">Tempe<span>Play</span></span>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Masuk</button>
        <button class="auth-tab" data-tab="register">Daftar</button>
      </div>
      <div class="auth-form" id="form-login">
        <button class="btn-google" id="btn-google-login">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>
          Lanjut dengan Google
        </button>
        <div class="divider"><span>atau</span></div>
        <input type="email" id="login-email" placeholder="Email" class="auth-input" />
        <input type="password" id="login-password" placeholder="Password" class="auth-input" />
        <div class="auth-error" id="login-error"></div>
        <button class="btn-primary w-full" id="btn-email-login">Masuk</button>
      </div>
      <div class="auth-form hidden" id="form-register">
        <button class="btn-google" id="btn-google-register">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>
          Daftar dengan Google
        </button>
        <div class="divider"><span>atau</span></div>
        <input type="text" id="register-name" placeholder="Nama tampilan" class="auth-input" />
        <input type="email" id="register-email" placeholder="Email" class="auth-input" />
        <input type="password" id="register-password" placeholder="Password" class="auth-input" />
        <div class="auth-error" id="register-error"></div>
        <button class="btn-primary w-full" id="btn-email-register">Daftar</button>
      </div>
      <button class="auth-close" id="auth-close">✕</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="watch-layout">
    <!-- VIDEO SECTION -->
    <div class="watch-main">
      <div class="video-wrapper">
        <div id="video-loading" class="video-loading">
          <div class="spinner"></div>
          <p>Memuat video...</p>
        </div>
        <video id="video-player" controls playsinline></video>
        <div id="video-error" class="video-error hidden">
          <p>😢 Video tidak tersedia dari sumber ini.</p>
          <p>Coba server lain di bawah.</p>
        </div>
      </div>

      <!-- SERVER SELECTOR -->
      <div class="server-bar">
        <span class="server-label">Server:</span>
        <div id="server-btns" class="server-btns">
          <!-- populated by JS -->
        </div>
        <a id="btn-watch-party-this" href="#" class="btn-watchparty" style="margin-left:auto">🍿 Nonton Bareng</a>
      </div>

      <!-- EPISODE LIST -->
      <div class="episode-section">
        <h3>📋 Daftar Episode</h3>
        <div id="episode-list" class="episode-list">
          <!-- populated by JS -->
        </div>
      </div>

      <!-- ANIME INFO -->
      <div class="anime-info-bar" id="anime-info-bar">
        <div class="anime-info-poster">
          <img id="info-poster" src="" alt="" />
        </div>
        <div class="anime-info-text">
          <div class="anime-info-genres" id="info-genres"></div>
          <h1 id="info-title"></h1>
          <div class="anime-info-meta" id="info-meta"></div>
          <p id="info-desc" class="anime-info-desc"></p>
        </div>
      </div>
    </div>

    <!-- SIDEBAR: Related -->
    <div class="watch-sidebar">
      <h3>🎯 Mungkin Lo Suka</h3>
      <div id="related-list" class="related-list">
        <div class="skeleton-card" style="aspect-ratio:auto;height:80px;margin-bottom:12px"></div>
        <div class="skeleton-card" style="aspect-ratio:auto;height:80px;margin-bottom:12px"></div>
        <div class="skeleton-card" style="aspect-ratio:auto;height:80px"></div>
      </div>
    </div>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/anilist.js"></script>
  <script src="../js/watch.js"></script>
</body>
</html>
